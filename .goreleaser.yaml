# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

# Adapted from ivuorinen/gh-history. Differences: davdrive mounts through the
# operating system's NFS client, which it supports on darwin and linux only,
# so there is no windows build; and its ~50 linked packages require their
# licences to ship with binaries, so the release carries a notices file.

version: 2

before:
  hooks:
    - go mod tidy
    - sh tools/notices.sh

builds:
  - binary: davdrive
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # Setting ldflags replaces GoReleaser's default, which is what stamps the
    # version, so main.version is set here explicitly. Without it every release
    # would report "dev".
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [binary]
    name_template: >-
      {{- .ProjectName }}_{{ .Os }}-{{ .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

signs:
  - cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

release:
  name_template: "{{.Tag}}"
  # The archives are binary-only and cannot carry extra files, so the licences
  # travel with the release itself: davdrive's own, and the notices file the
  # before hook writes with the licence of every linked package (MIT, BSD and
  # Apache-2.0 all require it for binary distribution).
  extra_files:
    - glob: LICENSE
    - glob: build/THIRD_PARTY_NOTICES.txt
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
