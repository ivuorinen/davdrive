#:schema https://mise.jdx.dev/schema/mise.json

# Adapted from ivuorinen/gh-history.
#
# Go is not listed under [tools]: its version comes from go.mod, which stays the
# single source of truth (CI's release job reads the same file through
# setup-go). Reading go.mod is off by default in mise, so it is enabled here for
# go alone.
[settings]
idiomatic_version_file_enable_tools = ["go"]

# Renovate's mise manager bumps these, so a version change is always a commit.
# golangci-lint replaces gh-history's staticcheck: it runs staticcheck among its
# linters, configured by .golangci.yml. go-licenses is not here: tools/notices.sh
# pins it with `go run`, because the release job has Go but not mise.
[tools]
golangci-lint = "2.15.0"
goreleaser = "2.20.2"
svu = "3.4.4"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
"go:github.com/rillig/gobco" = "1.3.4"

[tasks.build]
description = "Build for the current platform"
run = 'go build -trimpath -ldflags "-s -w" -o davdrive .'

[tasks.test]
description = "Run all tests, including the ~20 s concurrent-write test"
run = "go test ./..."

[tasks.test-short]
description = "Run the tests without the slow concurrent-write test"
run = "go test -short ./..."

[tasks.test-race]
description = "Run tests with the race detector"
run = "go test -race ./..."

# `go test -cover` gives statement coverage; gobco -branch adds branch
# coverage, listing each if, for and switch branch the tests never took.
# gobco takes one package per run. It also type-checks every file in a
# directory regardless of GOOS, so mount_darwin.go and mount_linux.go clash:
# internal/platform is measured through platform_unix.go alone; the branches
# of mount_darwin.go and mount_linux.go go unmeasured. Paths are passed
# relative so findings print relative.
[tasks.test-cov]
description = "Run tests with statement coverage, then branch coverage with gobco"
run = '''
go test -cover ./...
module=$(go list -m)
for pkg in $(go list ./...); do
  target=".${pkg#"$module"}"
  if [ "$target" = ./internal/platform ]; then
    target=./internal/platform/platform_unix.go
  fi
  echo
  echo "== $pkg"
  gobco -branch "$target"
done
'''

# .golangci.yml sets fix: true for local runs; a gate must report, not fix, or
# it passes on code it just rewrote. internal/platform differs per OS, so both
# builds are linted.
[tasks.lint]
description = "golangci-lint for darwin and linux, reporting without fixing"
run = [
  "GOOS=darwin golangci-lint run --fix=false ./...",
  "GOOS=linux golangci-lint run --fix=false ./...",
]

# Reachability-aware: only fails on vulnerabilities this code can actually
# reach, unlike a plain dependency-version scan.
[tasks.vuln]
description = "Scan for reachable vulnerabilities with govulncheck"
run = "govulncheck ./..."

[tasks.notices]
description = "Write build/THIRD_PARTY_NOTICES.txt, the licences of all linked packages"
run = "sh tools/notices.sh"

[tasks.snapshot]
description = "Build unsigned release artifacts into dist/ without publishing"
run = "goreleaser release --snapshot --clean --skip=sign,publish"

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf davdrive dist/ build/"

# --local keeps `mise upgrade` to this file; without it, it also rewrites the
# global mise config. Go itself is not bumped here: its version is the go.mod
# go line, which Renovate moves.
[tasks.update]
description = "Update Go modules and mise tools to their latest versions"
run = ["go get -u -t ./...", "go mod tidy", "mise upgrade --bump --local"]

# SemVer, not CalVer: the Go module proxy only recognises vMAJOR.MINOR.PATCH
# tags as module versions. svu reads the latest v* tag and prints the next one.
[tasks.release]
description = "Tag and push the next SemVer release (requires a clean main branch)"
usage = 'arg "<bump>" help="Which part to increase" { choices "patch" "minor" "major" }'
run = '''
if ! git diff --quiet || ! git diff --cached --quiet; then
  echo "Error: working tree is not clean"
  exit 1
fi
if [ "$(git rev-parse --abbrev-ref HEAD)" != "main" ]; then
  echo "Error: not on main branch"
  exit 1
fi
# svu counts from local tags; without the remote's, it would reuse a version.
git fetch --tags --quiet origin
tag=$(svu "$usage_bump")
# From v2 on, Go requires the major version in the module path (/v2): a v2+ tag
# on a path without it is invisible to `go get`.
major=${tag#v}
major=${major%%.*}
module=$(go list -m)
if [ "$major" -ge 2 ] && [ "${module##*/}" != "v$major" ]; then
  echo "Error: $tag needs the module path $module/v$major in go.mod first"
  exit 1
fi
echo "Releasing $tag..."
git tag -a "$tag" -m "Release $tag"
git push origin "$tag"
echo "Tag $tag pushed. GitHub Actions will build and sign the release."
'''

[tasks.all]
description = "Lint, race-enabled tests, vulnerability scan and build: the CI gates"
depends = ["lint", "test-race", "vuln", "build"]
